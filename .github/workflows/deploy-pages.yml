name: Deploy Order Check to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run dependency-free tests
        run: node --test tests/*.test.cjs

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble public app only
        run: |
          mkdir -p _site/icons
          cp index.html styles.css core.js app.js catalog-core.js catalog.js manifest.webmanifest service-worker.js .nojekyll _site/
          cp icons/icon-192.png icons/icon-512.png icons/apple-touch-icon.png icons/icon.svg _site/icons/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
